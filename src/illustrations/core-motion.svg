  <path d="M120 62L92 62" fill="none" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M40 116C40 68 92 62 120 62" fill="none" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="40" cy="68" r="3.4" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <circle cx="92" cy="62" r="3.4" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <circle cx="40" cy="116" r="3.8" fill="var(--il-fill, #DCD6CE)"/>
  <circle cx="120" cy="62" r="3.8" fill="var(--il-accent, #3E9077)"/>
