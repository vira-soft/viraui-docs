<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Effects — radial beam on card edge" class="il">
  <defs>
    <linearGradient id="panelG-components-effects" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--il-panel-top, #FCFBF9)"/>
      <stop offset="1" stop-color="var(--il-panel, #F7F5F2)"/>
    </linearGradient>
    <filter id="lift-components-effects" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6"
        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
    <filter id="liftL-components-effects" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
    <mask id="edgeRing-components-effects" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="160">
      <rect x="41.0" y="49.0" width="78.0" height="52.0" rx="11.0" fill="#fff"/>
      <rect x="44.5" y="52.5" width="71.0" height="45.0" rx="8.0" fill="#000"/>
    </mask>
    <radialGradient id="beam-components-effects" gradientUnits="userSpaceOnUse" cx="119" cy="49" r="42">
      <stop offset="0" stop-color="var(--il-accent, #3E9077)" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="var(--il-accent, #3E9077)" stop-opacity="0.35"/>
      <stop offset="1" stop-color="var(--il-accent, #3E9077)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="15" y="34" width="130" height="106" rx="16" fill="var(--il-ghost, #EAE7E2)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <rect x="22" y="30" width="116" height="100" rx="10" fill="url(#panelG-components-effects)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <g filter="url(#liftL-components-effects)">
    <rect x="41.0" y="49.0" width="78.0" height="52.0" rx="11.0" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  </g>
  <rect x="41.0" y="49.0" width="78.0" height="52.0" rx="11.0" fill="url(#beam-components-effects)" mask="url(#edgeRing-components-effects)"/>
  <rect x="66.0" y="62.5" width="28.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="58.0" y="72.7" width="44.0" height="5.0" rx="2.50" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="62.0" y="83.7" width="36.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/>
</svg>
