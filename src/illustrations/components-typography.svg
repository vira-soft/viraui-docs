  <rect x="70.0" y="72.4" width="12.0" height="3.0" rx="1.50" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="34.0" y="78.6" width="22.0" height="3.0" rx="1.50" fill="var(--il-fill, #DCD6CE)"/>
