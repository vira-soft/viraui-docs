<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Navigation — segmented tabs with sliding button indicator" class="il">
  <defs>
    <linearGradient id="panelG-components-navigation" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--il-panel-top, #FCFBF9)"/>
      <stop offset="1" stop-color="var(--il-panel, #F7F5F2)"/>
    </linearGradient>
    <filter id="lift-components-navigation" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6"
        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
    <filter id="liftL-components-navigation" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
  </defs>
  <rect x="15" y="34" width="130" height="106" rx="16" fill="var(--il-ghost, #EAE7E2)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <rect x="22" y="30" width="116" height="100" rx="10" fill="url(#panelG-components-navigation)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <!-- Tabs.List chrome -->
  <rect x="32.0" y="42.0" width="96.0" height="24.0" rx="8.0" fill="var(--il-fill-soft, #E9E4DC)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <!-- sliding Indicator (button wrapper on active item) -->
  <g filter="url(#lift-components-navigation)">
    <rect x="35.0" y="45.0" width="30.0" height="18.0" rx="6.0" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  </g>
  <!-- tab labels -->
  <rect x="42.0" y="52.0" width="16.0" height="4.0" rx="2.00" fill="var(--il-stroke, #35322D)"/>
  <rect x="72.0" y="52.0" width="16.0" height="4.0" rx="2.00" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="100.0" y="52.0" width="14.0" height="4.0" rx="2.00" fill="var(--il-fill, #DCD6CE)"/>
  <!-- panel -->
  <rect x="32.0" y="74.0" width="96.0" height="42.0" rx="8.0" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/>
  <rect x="42.0" y="86.0" width="36.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="42.0" y="95.0" width="72.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/>
  <rect x="42.0" y="104.0" width="54.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/>
</svg>
